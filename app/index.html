<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16161d">
  <meta name="description" content="Suniplayer — reproductor de audio para músicos, cantantes e intérpretes.">
  <title>Suniplayer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <div id="mini-player" class="mini-player">
    <span class="mini-icon">♫</span>
    <span class="mini-title"></span>
    <button class="mini-play btn-icon" aria-label="Play/Pausa">▶</button>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-btn active" data-view="home"><span class="nav-icon">🏠</span><span>Inicio</span></button>
    <button class="nav-btn" data-view="player"><span class="nav-icon">▶</span><span>Reproductor</span></button>
    <button class="nav-btn" data-view="library"><span class="nav-icon">📂</span><span>Librería</span></button>
    <button class="nav-btn" data-view="edit"><span class="nav-icon">✏️</span><span>Edit</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
